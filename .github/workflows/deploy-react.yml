name: Deploy Winter Smog React to Cloudflare
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "scripts/deploy-react-cloudflare.mjs"
      - ".github/workflows/deploy-react.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and test React dashboard
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: https://winter-smog-fastapi.onrender.com
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run lint
          npm run build
      - name: Require healthy community D1 service before changing live dashboard
        run: |
          for i in $(seq 1 12); do
            if curl --max-time 15 --fail --silent --show-error               https://winter-smog-community.1nc24cs197.workers.dev/health | grep -q '"ok":true'; then
              echo "Community database and service are ready."
              exit 0
            fi
            echo "Community service not ready; refusing unsafe frontend deployment."
            sleep 10
          done
          exit 1
      - name: Deploy React Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: c37eaec570d5c0261dd4b3fdf8764ce4
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deploy-react-cloudflare.mjs

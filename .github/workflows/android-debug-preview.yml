name: Build Android debug APK — mobile preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-debug-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Expo and verify TypeScript
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Generate Android native project with Expo prebuild
        run: npx expo prebuild --platform android --clean
      - name: Build Android debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload untrusted local-testing APK
        uses: actions/upload-artifact@v4
        with:
          name: winter-smog-android-debug-preview
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: Validate ClearSkies AI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run unit and integration tests
        run: npm test
      - name: Confirm production bundle
        run: node --check dist/worker.js

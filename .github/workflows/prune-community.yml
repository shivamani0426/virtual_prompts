name: Daily community privacy retention
on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate retention plan without touching database
        env:
          COMMUNITY_DRY_RUN: '1'
        run: node scripts/prune-community.mjs
      - name: Enforce community data-retention policy
        env:
          CLOUDFLARE_ACCOUNT_ID: c37eaec570d5c0261dd4b3fdf8764ce4
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/prune-community.mjs

name: Community public browser E2E and cleanup
on:
  push:
    branches: [main]
    paths: [".github/workflows/community-browser-e2e.yml"]
  workflow_run:
    workflows: ["Deploy Winter Smog React to Cloudflare"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-community:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install pinned Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium
      - name: Verify real public report / badge / alert workflows and erase temporary data
        run: node scripts/test-community-browser.mjs

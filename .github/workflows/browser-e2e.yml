name: Browser E2E — Winter Smog public assistant and impact
on:
  workflow_run:
    workflows: ["Deploy Winter Smog React to Cloudflare"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright browser dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Exercise public site in real desktop and mobile browsers
        run: node scripts/test-winter-browser.mjs

[project]
name = "winter-smog-api"
version = "0.2.0"
requires-python = ">=3.12"
description = "Winter Smog Assistant API database schema and migrations"
dependencies = [
    "SQLAlchemy>=2.0.36,<3.0",
    "alembic>=1.16,<2.0",
    "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "black>=25,<27",
    "flake8>=7,<8",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
